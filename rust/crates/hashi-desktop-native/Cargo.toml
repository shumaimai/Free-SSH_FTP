[package]
name = "hashi-desktop-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "Hashi-RustPreview"
path = "src/main.rs"

[dependencies]
hashi-core = { path = "../hashi-core" }
hashi-storage = { path = "../hashi-storage" }
hashi-terminal = { path = "../hashi-terminal" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "x11"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "=3.0.1"
rfd = "0.17"
webbrowser = "1"
url = "2"
