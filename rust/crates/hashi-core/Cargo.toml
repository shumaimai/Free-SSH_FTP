[package]
name = "hashi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hashi-storage = { path = "../hashi-storage" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa", "flate2", "des"] }
russh-sftp = "=3.0.1"
portable-pty = "=0.9.0"
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
base64 = "0.22"
tempfile.workspace = true
fs2.workspace = true
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "platform-verifier", "win-system-proxy"] }
semver = "1"
rand = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
hashi-terminal = { path = "../hashi-terminal" }
tempfile.workspace = true
