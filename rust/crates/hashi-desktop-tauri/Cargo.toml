[package]
name = "hashi-desktop-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "Hashi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
hashi-core = { path = "../hashi-core" }
hashi-storage = { path = "../hashi-storage" }
hashi-terminal = { path = "../hashi-terminal" }
hashi-ai = { path = "../hashi-ai" }
hashi-mcp = { path = "../hashi-mcp" }
tauri = { version = "=2.12.4", features = [] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
anyhow = "1"
russh-sftp = "=3.0.1"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
rfd = "0.17"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
webbrowser = "1"
