[workspace]
members = ["crates/hashi-storage", "crates/hashi-core", "crates/hashi-terminal", "crates/hashi-ai", "crates/hashi-mcp", "crates/hashi-desktop-native", "crates/hashi-desktop-tauri"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
fs2 = "=0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
