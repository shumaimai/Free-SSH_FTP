[workspace]
members = ["crates/hashi-storage", "crates/hashi-core", "crates/hashi-terminal", "crates/hashi-desktop-native"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
fs2 = "=0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
