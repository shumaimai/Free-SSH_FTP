name: Windows terminal
on:
  pull_request:
    paths:
      - 'hashi/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'Hashi.spec'
      - 'tools/hashi_mcp.py'
      - '.github/workflows/windows-terminal.yml'
jobs:
  conpty:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Record environment
        run: python -c "import sys, platform, importlib.metadata as m; print(sys.version, platform.platform()); print({p:m.version(p) for p in ['PySide6','paramiko','pyte','pywinpty','PyJWT']})"
      - run: python -m pytest -v -x --tb=short tests/test_local_terminal.py tests/test_terminal_backend.py tests/test_terminal_keys.py tests/test_terminal_resize.py tests/test_mcp_bridge.py tests/test_claude_cli.py tests/test_command_broker.py tests/test_ssh_core.py tests/test_ai_api.py tests/test_ai_core.py tests/test_chatgpt_oauth.py tests/test_config.py
      - run: python -m PyInstaller --noconfirm Hashi.spec
      - name: Record executable sizes
        run: Get-Item dist/Hashi.exe, dist/HashiMCP.exe | Select-Object Name, Length
      - run: python -m pytest tests/test_mcp_bridge.py -k packaged
      - name: Record test build identity and checksums
        shell: pwsh
        run: |
          $info = @{
            source_commit = (git rev-parse HEAD)
            application_version = (python -c "import hashi; print(hashi.__version__)")
            platform = "windows-x64"
            workflow_run = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            build_kind = "development-test"
          }
          $info | ConvertTo-Json | Set-Content dist/build-info.json -Encoding utf8NoBOM
          Get-FileHash dist/Hashi.exe, dist/HashiMCP.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Save Windows test executables
        uses: actions/upload-artifact@v7
        with:
          name: Hashi-test-windows-x64
          path: |
            dist/Hashi.exe
            dist/HashiMCP.exe
            dist/build-info.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
