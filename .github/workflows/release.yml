name: Release

# vX.Y.Z タグを push するとビルドして GitHub Release を作成する。
# v2.0.0 から配布物は Rust + Tauri 版(rust/crates/hashi-desktop-tauri)。旧Python版(v1.x)はビルドしない。
# 本体は WebView2Loader.dll と同じフォルダで動くので、zip だけを添付する。
# コード署名は SignPath Foundation(docs/code-signing-policy.md)。Secret SIGNPATH_API_TOKEN と
# Variables SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG / SIGNPATH_POLICY_SLUG が揃うまでは署名せずに配布する。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write       # リリース作成に必要
  id-token: write       # ビルド証明(artifact attestation)の署名に必要
  attestations: write   # ビルド証明を保存する

jobs:
  build-windows:
    runs-on: windows-latest
    # 署名は SignPath でオーナーが手動承認するまで待つ(最大60分)。
    timeout-minutes: 120
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rust/crates/hashi-desktop-tauri/frontend/package-lock.json

      - name: タグとCargoの版を照合
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag):
              raise SystemExit(f"::error::vX.Y.Z 形式ではありません: {tag}")
          with open("rust/Cargo.toml", "rb") as f:
              version = tomllib.load(f)["workspace"]["package"]["version"]
          if tag.removeprefix("v") != version:
              raise SystemExit(f"::error::タグ {tag} と Cargo の版 {version} が一致しません")
          print("ok", tag, version)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={version}\n")
          PY

      - name: Web 画面
        working-directory: rust/crates/hashi-desktop-tauri/frontend
        run: npm ci && npm run build

      - name: Release ビルド
        working-directory: rust
        run: cargo build --locked --release --bin Hashi --bin HashiMCP-RustPreview

      # --- コード署名(SignPath)。Secret が無いときは全部飛ばす ---
      - name: 署名前の exe を保存(SignPath へ渡す)
        id: upload-unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: hashi-unsigned-${{ github.ref_name }}
          path: |
            rust/target/release/Hashi.exe
            rust/target/release/HashiMCP-RustPreview.exe
          if-no-files-found: error

      - name: コード署名(SignPath。オーナーの承認待ち)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: rust/target/signed
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: 署名を確認して差し替え
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          foreach ($name in 'Hashi.exe', 'HashiMCP-RustPreview.exe') {
            $signed = Join-Path 'rust/target/signed' $name
            $sig = Get-AuthenticodeSignature $signed
            if ($sig.Status -ne 'Valid') { throw "$name の署名が有効ではありません: $($sig.Status)" }
            Write-Host "$name : $($sig.SignerCertificate.Subject)"
            Copy-Item $signed (Join-Path 'rust/target/release' $name) -Force
          }

      - name: 成果物(版の証跡・依存ライセンス)
        run: python tools/rust_artifact.py --profile release --tag "${{ github.ref_name }}" --binary rust/target/release/Hashi.exe --helper rust/target/release/HashiMCP-RustPreview.exe --output "rust/target/Hashi-${{ github.ref_name }}"

      - name: zip 化
        shell: pwsh
        run: Compress-Archive -Path "rust/target/Hashi-${{ github.ref_name }}" -DestinationPath "rust/target/Hashi-${{ github.ref_name }}-windows-x64.zip"

      # --- 配布物の確認手段(コード署名の代わりではない。SmartScreen の表示は変わらない) ---
      - name: SHA-256 を作る(書式は sha256sum と同じ形に固定する)
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib
          zip_path = pathlib.Path("rust/target/Hashi-${{ github.ref_name }}-windows-x64.zip")
          line = f"{hashlib.sha256(zip_path.read_bytes()).hexdigest()}  {zip_path.name}\n"
          pathlib.Path("rust/target/SHA256SUMS.txt").write_text(line, encoding="utf-8", newline="\n")
          print(line, end="")
          PY

      - name: ビルド証明(どのコミットのどの workflow で作られたかを GitHub が保証する)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: rust/target/Hashi-${{ github.ref_name }}-windows-x64.zip

      - name: winget / Scoop 用マニフェストを作る
        shell: bash
        run: |
          python tools/package_manifests.py "${{ steps.version.outputs.version }}" \
            --zip "rust/target/Hashi-${{ github.ref_name }}-windows-x64.zip" rust/target/package-manifests

      - name: マニフェストを成果物として保存(提出はオーナーが行う)
        uses: actions/upload-artifact@v4
        with:
          name: package-manifests-${{ github.ref_name }}
          path: rust/target/package-manifests
          if-no-files-found: error

      - name: リリースノート生成
        shell: bash
        run: |
          python tools/release_notes.py CHANGELOG.md "${GITHUB_REF_NAME#v}" > release-notes.md
          printf '\n---\nVerify the download / ダウンロードの確認: `SHA256SUMS.txt` and `gh attestation verify <zip> --repo %s` ([details](https://github.com/%s/blob/main/docs/verify-download.md))\n' "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" >> release-notes.md
          cat release-notes.md

      - name: リリース作成 + 添付
        uses: softprops/action-gh-release@v2
        with:
          name: Hashi ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            rust/target/Hashi-${{ github.ref_name }}-windows-x64.zip
            rust/target/SHA256SUMS.txt
