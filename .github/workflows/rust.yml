name: Rust migration
on:
  pull_request:
    paths:
      - 'rust/**'
      - 'hashi/runtime_guard.py'
      - 'main.py'
      - 'tests/test_runtime_guard.py'
      - '.github/workflows/rust.yml'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'hashi/runtime_guard.py'
      - 'main.py'
      - 'tests/test_runtime_guard.py'
      - '.github/workflows/rust.yml'
jobs:
  guards:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
      PYTHONUTF8: '1'
      HASHI_RUST_GUARD_BINARY: ${{ github.workspace }}/rust/target/debug/hashi-migration-check${{ runner.os == 'Windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - run: python -m pip install -r requirements-dev.txt
      - name: Rust format
        working-directory: rust
        run: cargo fmt --all --check
      - name: Rust lint
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust contracts
        working-directory: rust
        run: cargo test --locked --workspace
      - name: Build guard diagnostic
        working-directory: rust
        run: cargo build --locked --workspace --bins
      - name: Python and Rust process interoperability
        run: python -m pytest -v -x tests/test_runtime_guard.py
